openapi: 3.1.0
info:
  title: Chat History Export API
  version: 1.0.0
servers:
  - url: https://turnchat.factframe.tech
paths:
  /export:
    post:
      operationId: exportChatHistory
      summary: Export chat history as text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role:
                        type: string
                      content:
                        type: string
                    required:
                      - role
                      - content
              required:
                - messages
      responses:
        '200':
          description: Chat history as plain text
          content:
            text/plain:
              schema:
                type: string
